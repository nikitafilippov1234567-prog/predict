<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          font-family: 'Inter', sans-serif;
          background: #0F1113;
          color: #E6E7E8;
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 1rem;
        }

        .login-container {
          max-width: 400px;
          width: 100%;
          margin: 0 auto;
          background: #131415;
          border: 1px solid #222425;
          border-radius: 12px;
          padding: 2rem;
        }

        .login-header {
          text-align: center;
          margin-bottom: 2rem;
        }

        .login-header h2 {
          font-size: 1.5rem;
          font-weight: 500;
          margin: 0 0 0.5rem 0;
          color: #E6E7E8;
        }

        .login-header p {
          color: #9AA0A6;
          margin: 0;
          font-size: 0.9rem;
        }

        .form-group {
          margin-bottom: 1rem;
        }

        .form-group label {
          display: block;
          font-size: 0.75rem;
          color: #9AA0A6;
          margin-bottom: 0.5rem;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          font-weight: 500;
        }

        .form-group input {
          width: 100%;
          padding: 0.75rem;
          border-radius: 6px;
          border: 1px solid #242526;
          background: #0E1011;
          color: #E6E7E8;
          font-size: 1rem;
          outline: none;
          transition: border-color 0.2s;
        }

        .form-group input:focus {
          border-color: #8ACE00;
        }

        .submit-btn {
          background: #8ACE00;
          color: #0B0B0B;
          border: none;
          padding: 0.75rem;
          border-radius: 6px;
          font-weight: 500;
          cursor: pointer;
          transition: brightness 0.2s;
          width: 100%;
          font-size: 1rem;
        }

        .submit-btn:hover {
          filter: brightness(95%);
        }

        .error-message {
          color: #ff6b6b;
          text-align: center;
          margin: 1rem 0;
          background: rgba(255, 107, 107, 0.1);
          padding: 1rem;
          border-radius: 6px;
          border: 1px solid rgba(255, 107, 107, 0.3);
          font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Авторизация</h2>
            <p>Войдите в свою учетную запись</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" name="username" id="username" placeholder="Введите логин" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" name="password" id="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="submit-btn">Войти</button>
        </form>
        
        {% if form.errors %}
            <div class="error-message">Неверный логин или пароль</div>
        {% endif %}
    </div>
</body>
</html>
